<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#062d24" />
  <meta name="description" content="Student Budget Tracker — smart money, better student life." />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=2.0.0" />
  <title>Student Budget Tracker</title>
</head>
<body>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <section id="auth-shell" class="screen auth-screen">
    <div class="auth-card">
      <div class="brand-mark">🎓</div>
      <div class="brand-copy">
        <span class="eyebrow">Student Budget</span>
        <h1>Smart money.<br><span>Better student life.</span></h1>
        <p>Track expenses, plan your budget and reach your goals without the stress.</p>
      </div>
      <div id="auth-message" class="inline-message hidden"></div>
      <form id="auth-form" class="auth-form">
        <div id="signup-name-wrap" class="field hidden">
          <label for="auth-name">Full name</label>
          <input id="auth-name" autocomplete="name" placeholder="Alex Johnson" />
        </div>
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••" />
        </div>
        <button id="auth-submit" class="btn btn-primary btn-full" type="submit">Sign in</button>
      </form>
      <button id="auth-toggle" class="text-button" type="button">Create an account</button>
      <p class="auth-footnote">Your data stays tied to your account and is stored securely with Supabase.</p>
    </div>
  </section>

  <section id="onboarding-shell" class="screen onboarding-screen hidden">
    <div class="onboarding-card">
      <div class="onboarding-top"><div class="brand-mark small">🎓</div><span id="onboarding-step">Step 1 of 3</span></div>
      <div class="progress-track"><div id="onboarding-progress" class="progress-value" style="width:33%"></div></div>
      <div id="onboarding-content"></div>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-brand"><div class="brand-mark mini">🎓</div><div><strong>Student Budget</strong><span>Smart money. Better student life.</span></div></div>
      <div class="topbar-actions"><button id="month-chip" class="month-chip" type="button"></button><button id="profile-chip" class="profile-chip" type="button"><span id="profile-avatar">A</span><span id="profile-name">Student</span></button></div>
    </header>

    <main class="app-main">
      <section id="page-dashboard" class="page"></section>
      <section id="page-budget" class="page hidden"></section>
      <section id="page-add" class="page hidden"></section>
      <section id="page-history" class="page hidden"></section>
      <section id="page-goals" class="page hidden"></section>
      <section id="page-coach" class="page hidden"></section>
      <section id="page-settings" class="page hidden"></section>
      <section id="page-admin" class="page hidden"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-page="dashboard" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-page="budget" class="nav-item"><span>▣</span><small>Budget</small></button>
      <button data-page="add" class="nav-item add-nav"><span>＋</span><small>Add</small></button>
      <button data-page="goals" class="nav-item"><span>◎</span><small>Goals</small></button>
      <button data-page="history" class="nav-item"><span>◷</span><small>History</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <script type="module" src="app.js?v=2.0.0"></script>
</body>
</html>
